[package]
name = "whim-dav-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "whim-dav-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http2"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["http2", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

# Crypto
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
chacha20 = "0.9"
rand = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.11.0"
aes-gcm-siv = "0.12.1"
